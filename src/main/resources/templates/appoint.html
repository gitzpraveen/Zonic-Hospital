<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonic Hospital-Appointment</title>
    <link rel="stylesheet" th:href="@{/css/appoint.css}">
    <style>
        
    </style>
</head>
<body>

    <h2><a th:href="@{/}"> << Back to Home </a></h2>
    
    <h3>Schedule an Appointment</h3>
    <div class="container">
   
            <form th:action="@{/appointUser}" method="post" th:object="${appoint}">
                <label for="patientName">Patient Name:</label>
                <input type="text" id="patientName" th:field="*{patientName}" required>

              

                <label for="age">Age:</label>
                <input type="number" id="age" th:field="*{age}" required>

                <label for="doctor">Select Doctor:</label>
                <select id="doctor" name="doctor" th:field="*{doctor}" required>
                    <option th:value="drSmith" th:text="dr.Smith">Dr. Smith (Neurology)</option>
                    <option th:value="drJohnson" th:text="dr.Johnson">Dr. Johnson (Orthology)</option>
                    <option th:value="drJames" th:text="dr.James">Dr. James (General Surgury)</option>
                    <option th:value="drArul" th:text="dr.Arul">Dr. Arul (ENT)</option>
                    <!-- Add more options as needed -->

                </select>

                <label for="appointmentDate">Preferred Appointment Date:</label>
                <input type="date" id="appointmentDate" th:field="*{date}" required>

                <label for="messagearea">Additional Information:</label>
                <textarea id="messagearea" th:field="*{additionalInformation}" rows="2" cols="35"></textarea>
                <br>
                <button type="submit">Submit Appointment</button>
            </form>

            <div class="message" id="message" th:if="${message!=null}">
                [[${message}]]
             </div>

    </div>
</body>
</html>
